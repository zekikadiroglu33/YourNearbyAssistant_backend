services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: location_assistant
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  go-service:
    build:
      context: ./services/go-service
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql://postgres:password@postgres:5432/location_assistant?sslmode=disable
      GOOGLE_PLACES_API_KEY: ${GOOGLE_PLACES_API_KEY}
      GO_SERVICE_PORT: 8080
      PYTHON_SERVICE_URL: http://python-service:8001
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  python-service:
    build:
      context: ./services/python-service
      dockerfile: Dockerfile
    environment:
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      PYTHON_SERVICE_PORT: 8001
      GO_SERVICE_URL: http://go-service:8080
    ports:
      - "8001:8001"

  nginx:
    image: nginx:alpine
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf
    ports:
      - "80:80"
    depends_on:
      - go-service
      - python-service

volumes:
  postgres_data:
